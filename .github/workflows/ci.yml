name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python package
        run: python -m compileall -q evalorigin && python -m evalorigin --version
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go compiler
        run: cd compiler && go build ./...
