<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="ep-pipe-title ep-pipe-desc">
  <title id="ep-pipe-title">EvalOrigin compile pipeline</title>
  <desc id="ep-pipe-desc">Traces and incidents flow into regression cases, which fan out into rubrics and replay fixtures, and both feed a release gate that resolves to one of three verdicts: pass, warn, or block.</desc>
  <rect x="0" y="0" width="760" height="300" rx="14" fill="#141416"/>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- inputs -->
    <g>
      <rect x="24" y="118" width="128" height="64" rx="9" fill="#f59e0b"/>
      <text x="88" y="146" font-size="14" font-weight="700" fill="#141416">Traces</text>
      <text x="88" y="166" font-size="11" fill="#3a2a08">+ incidents</text>
    </g>

    <!-- cases -->
    <g>
      <rect x="212" y="118" width="128" height="64" rx="9" fill="#ffb347"/>
      <text x="276" y="146" font-size="14" font-weight="700" fill="#141416">Regression</text>
      <text x="276" y="166" font-size="12" font-weight="700" fill="#141416">cases</text>
    </g>

    <!-- rubrics / fixtures -->
    <g>
      <rect x="400" y="52" width="128" height="56" rx="9" fill="none" stroke="#ffb347" stroke-width="2.5"/>
      <text x="464" y="78" font-size="13" font-weight="700" fill="#ffb347">Rubrics</text>
      <text x="464" y="96" font-size="10.5" fill="#c9c9cf">weighted criteria</text>

      <rect x="400" y="192" width="128" height="56" rx="9" fill="none" stroke="#ffb347" stroke-width="2.5"/>
      <text x="464" y="218" font-size="13" font-weight="700" fill="#ffb347">Fixtures</text>
      <text x="464" y="236" font-size="10.5" fill="#c9c9cf">replay pins</text>
    </g>

    <!-- gate + verdicts -->
    <g>
      <rect x="592" y="110" width="144" height="80" rx="9" fill="#1f1f23" stroke="#ffb347" stroke-width="3"/>
      <text x="664" y="136" font-size="14" font-weight="700" fill="#ffb347">Release gate</text>
      <g font-size="11" text-anchor="start">
        <circle cx="612" cy="152" r="4.5" fill="#3fbf7f"/><text x="624" y="156" fill="#c9c9cf">pass · exit 0</text>
        <circle cx="612" cy="170" r="4.5" fill="#f5c451"/><text x="624" y="174" fill="#c9c9cf">warn · exit 10</text>
        <circle cx="612" cy="188" r="4.5" fill="#e5695f"/><text x="624" y="192" fill="#c9c9cf">block · exit 20</text>
      </g>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#ep-arrow)">
    <line x1="152" y1="150" x2="208" y2="150"/>
    <line x1="340" y1="140" x2="396" y2="86"/>
    <line x1="340" y1="160" x2="396" y2="216"/>
    <line x1="528" y1="86" x2="588" y2="132"/>
    <line x1="528" y1="216" x2="588" y2="164"/>
  </g>
  <defs>
    <marker id="ep-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#ffb347"/>
    </marker>
  </defs>

  <!-- content-hash token traveling the pipeline, one per branch -->
  <circle r="4.5" fill="#ffe0a0">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M152 150 L208 150 L340 150 L396 86 L528 86 L588 132"/>
  </circle>
  <circle r="4.5" fill="#ffe0a0">
    <animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M152 150 L208 150 L340 150 L396 216 L528 216 L588 164"/>
  </circle>

  <text x="380" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b6b72" text-anchor="middle">deterministic: same inputs compile to a byte-identical pack</text>
</svg>

