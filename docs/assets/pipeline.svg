<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="ep-pipe-title ep-pipe-desc">
  <title id="ep-pipe-title">EvalOrigin compile pipeline</title>
  <desc id="ep-pipe-desc">Traces and incidents flow into regression cases, which fan out into rubrics and replay fixtures, and both feed a release gate that resolves to one of three verdicts: pass, warn, or block.</desc>
  <rect x="0" y="0" width="760" height="300" rx="14" fill="#141416"/>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- inputs -->
    <g>
      <rect x="24" y="118" width="128" height="64" rx="9" fill="#f59e0b"/>
      <text x="88" y="146" font-size="14" font-weight="700" fill="#141416">Traces</text>
      <text x="88" y="166" font-size="11" fill="#3a2a08">+ incidents</text>
    </g>

    <!-- cases -->
    <g>
      <rect x="212" y="118" width="128" height="64" rx="9" fill="#ffb347"/>
      <text x="276" y="146" font-size="14" font-weight="700" fill="#141416">Regression</text>
      <text x="276" y="166" font-size="12" font-weight="700" fill="#141416">cases</text>
    </g>
