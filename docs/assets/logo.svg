<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-labelledby="ep-logo-title ep-logo-desc">
  <title id="ep-logo-title">EvalOrigin</title>
  <desc id="ep-logo-desc">A jagged execution trace on the left resolves into a checkmarked gate on the right, over the wordmark EvalOrigin: trace to evaluation.</desc>
  <defs>
    <linearGradient id="ep-charcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2f"/>
      <stop offset="1" stop-color="#141416"/>
