<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-labelledby="ep-logo-title ep-logo-desc">
  <title id="ep-logo-title">EvalOrigin</title>
  <desc id="ep-logo-desc">A jagged execution trace on the left resolves into a checkmarked gate on the right, over the wordmark EvalOrigin: trace to evaluation.</desc>
  <defs>
    <linearGradient id="ep-charcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2f"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="480" height="200" rx="16" fill="url(#ep-charcoal)"/>

  <!-- trace polyline: nodes are steps, the path draws in to signal replay -->
  <g fill="none" stroke="#ffb347" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 108 L96 66 L152 128 L208 78 L256 100">
      <animate attributeName="stroke-dasharray" values="0 360;360 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#ffb347">
    <circle cx="40" cy="108" r="5.5"><animate attributeName="r" values="5.5;8;5.5" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="96" cy="66" r="4.5"/>
