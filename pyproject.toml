[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalorigin"
version = "1.0.2"
description = "Trace-to-evaluation compiler: turn failures and execution traces into regression cases, rubrics, fixtures and release gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["evaluation", "regression", "release-gate", "traces", "rubric", "fixtures"]
authors = [{ name = "EvalOrigin" }]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
evalorigin = "evalorigin.cli:main"

[project.urls]
Documentation = "https://example.invalid/evalorigin/docs"
Source = "https://example.invalid/evalorigin"

[tool.setuptools]
packages = ["evalorigin"]

